version: "3.8"

services:

  app:

    build: .

    container_name: attendance-manager

    ports:
      - "5001:5001"

    depends_on:
      - mysql


  mysql:

    image: mysql:8

    container_name: attendance-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: employee_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:

  mysql_data:
